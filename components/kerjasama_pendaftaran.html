<!-- Script AJAX Formspree -->
<script>
  const form = document.getElementById("formspree-kerjasama");
  const status = document.getElementById("form-status");
  const submitBtn = document.getElementById("submit-btn");

  if (form) {
    form.addEventListener("submit", async function (event) {
      event.preventDefault();
      const data = new FormData(event.target);
      submitBtn.disabled = true;
      submitBtn.innerText = "Mengirim...";

      try {
        const response = await fetch(event.target.action, {
          method: form.method,
          body: data,
          headers: { 'Accept': 'application/json' }
        });

        if (response.ok) {
          status.classList.remove("hidden");
          form.reset();
          submitBtn.innerText = "Terikirim!";
        } else {
          alert("Terjadi kesalahan saat mengirim data. Silakan daftar langsung via WhatsApp.");
          submitBtn.disabled = false;
          submitBtn.innerText = "Kirim Form Pendaftaran";
        }
      } catch (error) {
        alert("Koneksi gagal. Silakan coba lagi atau daftar via WhatsApp.");
        submitBtn.disabled = false;
        submitBtn.innerText = "Kirim Form Pendaftaran";
      }
    });
  }
</script>
